[build]
  command = "npm run build"
  publish = "dist"

# --- API proxy (production) ---
# Lets the frontend use a relative /api base (same as local dev). Netlify
# evaluates these rules BEFORE public/_redirects, and force=true makes /api/*
# win over the SPA catch-all (/* -> /index.html).
#
# Replace https://YOUR-BACKEND-ORIGIN with your deployed backend origin
# (the host serving /api, NOT including /api). Example:
#   to = "https://api.granvia.com/api/:splat"
#
# Alternative: skip this rule and instead set VITE_API_URL to the full backend
# URL as a Netlify build env var (requires CORS enabled on the backend).
[[redirects]]
  from = "/api/*"
  to = "https://YOUR-BACKEND-ORIGIN/api/:splat"
  status = 200
  force = true
